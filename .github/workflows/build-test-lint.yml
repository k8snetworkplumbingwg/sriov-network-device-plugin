name: build-test-lint
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: false
        type: string
      ref:
        description: 'Git ref / commit SHA'
        required: false
        type: string

permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Build
        run: make build

  test:
    runs-on: ubuntu-24.04
    needs: build
    name: test
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install hwdata
        run: sudo apt-get install hwdata -y

      - name: Go test
        run: make test-race

  test-coverage:
    runs-on: ubuntu-24.04
    needs: build
    name: test-coverage
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install hwdata
        run: sudo apt-get install hwdata -y

      - name: Go test with coverage
        run: make test-coverage
      
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: test/coverage/cover.out

  golangci:
    name: Golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: lint test
        run: make lint

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04
    env:
      SHELLCHECK_OPTS: -e SC3037 # disabled because of false issue in entrypoint.sh ln 14-21. Not using any complicated flags. Works with alpines almquist shell.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.ref }}
        persist-credentials: false
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master
      with:
        ignore: vendor

  hadolint:
    runs-on: ubuntu-24.04
    name: Hadolint
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.ref }}
        persist-credentials: false
    - uses: hadolint/hadolint-action@v3.5.0
      name: Run Hadolint
      with:
       dockerfile: ./images/Dockerfile
       ignore: DL3018 # DL3018: GH issue 368

  go-check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.ref }}
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.26.x

    # if this fails, run go mod tidy
    - name: Check if module files are consistent with code
      run: go mod tidy && git diff --exit-code

    # if this fails, run go mod vendor
    - name: Check if vendor directory is consistent with go modules
      run: go mod vendor && git diff --exit-code

  sriov-operator-e2e-test:
    name: SR-IOV operator e2e tests
    needs: [ build,test ]
    # Prevent auto-executing on external fork PRs to protect private self-hosted runners
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [ sriov ]
    env:
      TEST_REPORT_PATH: k8s-artifacts
      PR_NUM: ${{ inputs.pr_number || github.event.pull_request.number || github.run_id }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: build sriov-network-device-plugin image
        run: podman build -f images/Dockerfile -t "ghaction-sriov-network-device-plugin:pr-${PR_NUM}" .

      - name: Check out sriov operator's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: k8snetworkplumbingwg/sriov-network-operator
          path: sriov-network-operator-wc
          persist-credentials: false

      - name: run test
        run: make test-e2e-conformance-virtual-k8s-cluster-ci
        working-directory: sriov-network-operator-wc
        env:
          LOCAL_SRIOV_DEVICE_PLUGIN_IMAGE: ghaction-sriov-network-device-plugin:pr-${PR_NUM}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.TEST_REPORT_PATH }}
          path: ./sriov-network-operator-wc/${{ env.TEST_REPORT_PATH }}
